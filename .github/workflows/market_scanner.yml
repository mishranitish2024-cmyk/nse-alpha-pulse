name: NSE Intraday Scanner & Paper-Trade Bot

on:
  schedule:
    # 0. Pre-market 4-checks at 09:00 AM IST (03:30 AM UTC)
    - cron: '30 3 * * 1-5'
    # 1. Opening hour 5m scans: 09:20 AM to 09:55 AM IST (03:50 to 03:55 UTC)
    - cron: '50,55 3 * * 1-5'
    # 2. Core session 5m scans: 10:00 AM to 02:55 PM IST (04:00 to 08:55 UTC)
    - cron: '*/5 4-8 * * 1-5'
    # 3. Closing hour 5m scans: 03:00 PM to 03:25 PM IST (09:00 to 09:25 UTC)
    - cron: '0,5,10,15,20,25 9 * * 1-5'
    # 4. Auto Square-Off PnL Report at 03:15 PM IST (09:45 AM UTC)
    - cron: '45 9 * * 1-5'
    # 5. Night-Before NR7 Watchlist at 04:10 PM IST (10:40 AM UTC)
    - cron: '40 10 * * 1-5'
  workflow_dispatch:
    inputs:
      scan_mode:
        description: 'Select scan mode (premarket, orb, pnl, or eod)'
        required: true
        default: 'orb'
        type: choice
        options:
          - premarket
          - orb
          - pnl
          - eod

permissions:
  contents: write

jobs:
  run-nse-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Select Scan Mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "MODE=${{ github.event.inputs.scan_mode }}" >> $GITHUB_ENV
          elif [ "${{ github.event.schedule }}" = "30 3 * * 1-5" ]; then
            echo "MODE=premarket" >> $GITHUB_ENV
          elif [ "${{ github.event.schedule }}" = "45 9 * * 1-5" ]; then
            echo "MODE=pnl" >> $GITHUB_ENV
          elif [ "${{ github.event.schedule }}" = "40 10 * * 1-5" ]; then
            echo "MODE=eod" >> $GITHUB_ENV
          else
            echo "MODE=orb" >> $GITHUB_ENV
          fi

      - name: Run Scanner & Send Telegram Alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python run_single_job.py $MODE

      - name: Generate Live Performance Charts & Commit to Repo
        run: |
          python -c "from chart_generator import generate_equity_curve_chart; generate_equity_curve_chart()"
          if [ -f paper_trades.db ] || [ -f equity_curve.png ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add paper_trades.db equity_curve.png
            git diff --staged --quiet || git commit -m "chore(dashboard): update live equity curve and paper trades db [skip ci]"
            git push
          fi
