name: NSE Intraday Scanner & Paper-Trade Bot

on:
  schedule:
    - cron: '30 3 * * 1-5'   # 9:00 AM IST (Mon-Fri) -> 4 Pre-Market Checks & Market Bias
    - cron: '0 4 * * 1-5'    # 9:30 AM IST (Mon-Fri) -> ORB & Candlestick Scan
    - cron: '45 4 * * 1-5'   # 10:15 AM IST (Mon-Fri) -> VWAP Pullback Scan
    - cron: '45 9 * * 1-5'   # 3:15 PM IST (Mon-Fri) -> Auto Square-Off PnL Report
    - cron: '40 10 * * 1-5'  # 4:10 PM IST (Mon-Fri) -> Night-Before NR7 Watchlist
  workflow_dispatch:
    inputs:
      scan_mode:
        description: 'Select scan mode (premarket, orb, pnl, or eod)'
        required: true
        default: 'orb'
        type: choice
        options:
          - premarket
          - orb
          - pnl
          - eod

permissions:
  contents: write

jobs:
  run-nse-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Select Scan Mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "MODE=${{ github.event.inputs.scan_mode }}" >> $GITHUB_ENV
          elif [ "${{ github.event.schedule }}" = "30 3 * * 1-5" ]; then
            echo "MODE=premarket" >> $GITHUB_ENV
          elif [ "${{ github.event.schedule }}" = "45 9 * * 1-5" ]; then
            echo "MODE=pnl" >> $GITHUB_ENV
          elif [ "${{ github.event.schedule }}" = "40 10 * * 1-5" ]; then
            echo "MODE=eod" >> $GITHUB_ENV
          else
            echo "MODE=orb" >> $GITHUB_ENV
          fi

      - name: Run Scanner & Send Telegram Alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python run_single_job.py $MODE

      - name: Generate Live Performance Charts & Commit to Repo
        run: |
          python -c "from chart_generator import generate_equity_curve_chart; generate_equity_curve_chart()"
          if [ -f paper_trades.db ] || [ -f equity_curve.png ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add paper_trades.db equity_curve.png
            git diff --staged --quiet || git commit -m "chore(dashboard): update live equity curve and paper trades db [skip ci]"
            git push
          fi
