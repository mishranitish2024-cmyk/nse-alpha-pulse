name: NSE Continuous 6-Hour Intraday Runner

on:
  schedule:
    # 03:45 AM UTC = 09:15 AM IST (Mon-Fri) -> Starts at market open and runs continuously until 03:20 PM IST
    - cron: '45 3 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-full-session:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # 6-hour execution window
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Single Continuous Trading Loop (09:15 AM - 03:20 PM IST)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python runner.py

      - name: Commit Updated SQLite DB & Live Equity Curve
        run: |
          if [ -f paper_trades.db ] || [ -f equity_curve.png ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add paper_trades.db equity_curve.png
            git diff --staged --quiet || git commit -m "chore(live): update paper trades db & equity curve [skip ci]"
            git push
          fi

